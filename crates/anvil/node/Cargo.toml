[package]
name = "reth-node-anvil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Anvil dev node built on reth's node builder"

[[bin]]
name = "anvil-reth"
path = "src/bin/anvil_reth.rs"
required-features = ["cli"]

[lints]
workspace = true

[dependencies]
# reth
reth-ethereum-engine-primitives.workspace = true
reth-ethereum-primitives.workspace = true
reth-node-builder.workspace = true
reth-node-ethereum.workspace = true
reth-tracing.workspace = true
reth-provider.workspace = true
reth-evm.workspace = true
reth-primitives-traits.workspace = true
reth-rpc-api.workspace = true
reth-rpc-eth-api.workspace = true
reth-rpc-builder.workspace = true
reth-rpc-server-types.workspace = true
reth-storage-api.workspace = true
reth-transaction-pool.workspace = true
reth-engine-local.workspace = true
reth-rpc-eth-types.workspace = true
reth-node-api.workspace = true
reth-chainspec.workspace = true
reth-engine-primitives.workspace = true
reth-payload-primitives.workspace = true

# ethereum
alloy-consensus = { workspace = true, features = ["serde"] }
alloy-primitives.workspace = true
alloy-rpc-types-anvil.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-rpc-types-eth.workspace = true

# revm
revm.workspace = true

# async
tokio.workspace = true
tokio-stream.workspace = true

# misc
eyre.workspace = true
jsonrpsee = { workspace = true, features = ["server", "macros"] }
parking_lot.workspace = true

# cli (optional, for the binary)
clap = { workspace = true, features = ["derive"], optional = true }
alloy-genesis = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, features = ["mnemonic"], optional = true }
reth-node-core = { workspace = true, optional = true }
reth-tasks = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
reth-db.workspace = true
reth-node-core.workspace = true
reth-e2e-test-utils.workspace = true
reth-tasks.workspace = true
reth-tracing.workspace = true
reth-rpc-api = { workspace = true, features = ["client"] }

alloy-primitives.workspace = true
alloy-genesis.workspace = true

futures.workspace = true
tokio = { workspace = true, features = ["full"] }
serde_json.workspace = true
jsonrpsee = { workspace = true, features = ["http-client"] }
eyre.workspace = true

[features]
default = []
cli = [
    "dep:clap",
    "dep:alloy-genesis",
    "dep:alloy-signer-local",
    "dep:reth-node-core",
    "dep:reth-tasks",
    "dep:tracing-subscriber",
    "dep:futures",
    "reth-node-builder/test-utils",
]
